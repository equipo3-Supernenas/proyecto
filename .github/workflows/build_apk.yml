name: Build Android APK (Main)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew
      working-directory: src/Android/Fitepad

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug
      working-directory: src/Android/Fitepad

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: fitepad-debug-apk
        path: src/Android/Fitepad/app/build/outputs/apk/debug/app-debug.apk